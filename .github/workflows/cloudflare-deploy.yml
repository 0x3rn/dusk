# Builds the Worker on a clean Linux checkout (so no local .env secrets can end up in it) and
# deploys it to Cloudflare. Manual only for now: run it from the Actions tab. See docs/CLOUDFLARE.md.
name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check types, lint and unit tests
        run: |
          npx tsc --noEmit
          npx eslint .
          npx vitest run
      - name: Build the Worker
        run: npm run cf:build
        env:
          # Public values that Next bakes into the browser bundle. Set them under Settings > Variables.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Deploy (refuses a build that contains secrets)
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
